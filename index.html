<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#191a22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Re della Gabbia</title>
<meta name="description" content="Calcio 3 contro 3 in gabbia: parti scarso, allena la squadra, compra scarpe e giocatori, inventa numeri e vinci tornei, campionato e sfide con gli amici.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Saira+Condensed:wght@500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Re della Gabbia</h1>
    <div class="who" id="who" hidden><span id="whoName"></span> · <b class="coin" id="whoCoins">0 M</b></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="view" aria-label="La gabbia in 3D"></canvas>
    <div class="loading" id="loading">Apro la gabbia…</div>

    <div id="matchUi" hidden>
      <div class="score">
        <span class="team" id="tA"></span><b id="sc">0 - 0</b><span class="team" id="tB"></span>
        <em id="clock">2:00</em>
      </div>
      <button class="quit" id="quit" type="button">Esci</button>
      <div class="banner" id="banner"></div>
      <div class="seq" id="seq"></div>
      <div class="stick" id="stick" aria-label="Joystick direzionale"><div class="knob" id="knob"></div></div>
      <div class="btns">
        <button class="pad c" id="bC" type="button"><b>N</b><small id="lC">Numeri</small></button>
        <button class="pad b" id="bB" type="button"><b>P</b><small id="lB">Passa</small></button>
        <button class="pad a" id="bA" type="button"><b>T</b><small id="lA">Tira</small></button>
      </div>
    </div>

    <div class="panel" id="panel" hidden></div>
    <div class="toast" id="toast"></div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
